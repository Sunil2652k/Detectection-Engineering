title: ChainDrop NPM Worm Malicious Package Execution
id: 2d36c00d-08ab-4ad3-9a8a-99d43ca8b7e7
status: experimental
description: Detects suspicious Node.js/npm package execution patterns associated with ChainDrop-style malware, including postinstall scripts, registry tampering, rogue dependencies, and command execution during installation.
author: Copilot
date: 2026-10-17
references:
  - https://unit42.paloaltonetworks.com/chaindrop-npm-worm-analysis/
logsource:
  category: process_creation
  product: linux
  service: shell
definition:
  selection_npm:
    Image|endswith:
      - '/npm'
      - '/node'
      - '\\node.exe'
      - '\\npm.cmd'
    CommandLine|contains:
      - 'npm install'
      - 'npm i '
      - 'npm ci'
      - 'npm exec'
  selection_malicious:
    CommandLine|contains:
      - 'postinstall'
      - 'preinstall'
      - 'install.js'
      - 'node-gyp'
      - 'curl '
      - 'wget '
      - 'powershell'
      - 'cmd.exe'
      - 'base64'
      - 'eval('
      - 'child_process'
      - 'execSync'
      - 'spawn('
      - 'require("child_process")'
      - 'npmrc'
      - '.npmrc'
      - 'registry.npmjs.org'
      - '_npmrc'
      - 'package-lock.json'
      - 'node_modules'
  condition: selection_npm and selection_malicious
falsepositives:
  - Legitimate software installation or dependency resolution in development environments
  - Standard Node.js build steps without suspicious download or execution behavior
level: high
fields:
  - Image
  - CommandLine
  - ParentImage
  - User
  - FileName
  - CurrentDirectory
tags:
  - attack.execution
  - attack.persistence
  - attack.command_and_control
  - attack.t1059
  - attack.t1505
